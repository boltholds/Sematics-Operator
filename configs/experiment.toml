default_model = "small"

[models.small]
# Relative to SO_MODELS_DIR. Must contain HF config, tokenizer and weights.
path = "my-small-model"
device = "auto"
dtype = "float32"
# Run `semop inspect` to list exact Linear module names. Empty = middle MLP auto-selection.
target_module = ""

[models.second]
path = "my-second-model"
device = "auto"
dtype = "float32"
target_module = ""

# GGUF checkpoint relative to SO_MODELS_DIR (e.g. your LM Studio models folder).
[models.lfm2_5_1_2b_gguf]
path = "lmstudio-community/LFM2.5-1.2B-Instruct-GGUF/LFM2.5-1.2B-Instruct-Q8_0.gguf"
device = "auto"
dtype = "float32"
target_module = "" # Automatically selects an internal feed_forward.w2.

[experiment]
rank = 4
steps = 30
learning_rate = 0.003
locality_weight = 0.5
regularization = 0.0001
max_length = 512
seed = 42
# Relative to this TOML file:
output_dir = "../runs"
