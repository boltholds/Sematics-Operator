[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantics-operator"
version = "0.2.0"
description = "Experiments with reversible semantic operators in language-model weights"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.4,<3", "transformers>=4.57.6,<5", "python-dotenv>=1.0,<2", "safetensors>=0.4,<1", "gguf>=0.19,<0.20", "accelerate>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "matplotlib>=3.8,<4"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
semop = "semantics_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
